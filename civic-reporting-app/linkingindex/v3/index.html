<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INNOINDIA Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>INNOINDIA</h2>
    <ul>
      <li>Dashboard</li>
      <li>Complaints</li>
      <li>Users</li>
      <li>Analytics</li>
      <li>Settings</li>
      <li>History</li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <h1>INNOINDIA Dashboard</h1>

    <!-- Complaints Section -->
    <h2>Complaints</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Issue</th>
          <th>User</th>
          <th>Status</th>
          <th>Location</th>
          <th>Date</th>
          <th>Action</th>
          <th>View</th>
        </tr>
      </thead>
      <tbody id="complaints-table"></tbody>
    </table>

    <!-- Users Section -->
    <h2 style="margin-top:40px;">Users</h2>
    <table>
      <thead>
        <tr>
          <th>User ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Registered Date</th>
          <th>View Reports</th>
        </tr>
      </thead>
      <tbody id="users-table"></tbody>
    </table>
  </div>

  <!-- Firebase Logic -->
  <script type="module" src="app.js"></script>
</body>
</html>
