<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Details</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; background: #f4f6f8; padding: 20px; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h2 { color: #1976d2; }
    p { margin: 8px 0; }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "blogapp-bd46d.firebaseapp.com",
      databaseURL: "https://blogapp-bd46d-default-rtdb.firebaseio.com/",
      projectId: "blogapp-bd46d",
      storageBucket: "blogapp-bd46d.appspot.com",
      messagingSenderId: "SENDER_ID",
      appId: "APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Get reportId from URL
    const params = new URLSearchParams(window.location.search);
    const reportId = params.get("reportId");

    async function loadReport() {
      if (!reportId) return;
      const reportRef = ref(db, "blogs/reports/" + reportId);
      const snapshot = await get(reportRef);
      if (snapshot.exists()) {
        const r = snapshot.val();
        document.getElementById("report").innerHTML = `
          <div class="card">
            <h2>Report ID: ${reportId}</h2>
            <p><strong>Description:</strong> ${r.description || "N/A"}</p>
            <p><strong>Status:</strong> ${r.status || "Submitted"}</p>
            <p><strong>Location:</strong> ${r.location || "N/A"}</p>
            <p><strong>Date:</strong> ${r.submitDate || "N/A"}</p>
            <p><strong>Officer:</strong> ${r.officer || "Unassigned"}</p>
          </div>
        `;
      } else {
        document.getElementById("report").innerHTML = `<p>Report not found</p>`;
      }
    }

    loadReport();
  </script>
</head>
<body>
  <h1>Complaint Details</h1>
  <div id="report"></div>
</body>
</html>
