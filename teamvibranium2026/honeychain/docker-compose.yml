services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: honey
      POSTGRES_PASSWORD: chain2026
      POSTGRES_DB: honeychain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: ./api
    ports: ["4000:4000"]
    env_file: ./api/.env
    depends_on: [db]
  ai:
    build: ./ai
    ports: ["8001:8001"]
    command: uvicorn main:app --host 0.0.0.0 --port 8001
volumes:
  pgdata:
