<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - INNOINDIA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Complaints Dashboard</h1>

  <!-- Complaints Table -->
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Issue</th>
        <th>Officer Assigned</th>
        <th>Status</th>
        <th>Location</th>
        <th>Date</th>
        <th>Media</th>
        <th>Action</th>
        <th>View</th>
      </tr>
    </thead>
    <tbody id="complaints-table"></tbody>
  </table>

  <script type="module" src="app.js"></script>
</body>
</html>
