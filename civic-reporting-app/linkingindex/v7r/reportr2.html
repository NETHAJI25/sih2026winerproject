<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Reports</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    // Firebase config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "blogapp-bd46d.firebaseapp.com",
      databaseURL: "https://blogapp-bd46d-default-rtdb.firebaseio.com/",
      projectId: "blogapp-bd46d",
      storageBucket: "blogapp-bd46d.appspot.com",
      messagingSenderId: "SENDER_ID",
      appId: "APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Get userId from query string
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId');

    const tableBody = document.getElementById("user-reports-table");
    const usernameEl = document.getElementById("username");

    if (!userId) {
      tableBody.innerHTML = "<tr><td colspan='7'>No user selected</td></tr>";
    } else {
      usernameEl.textContent = `Reports for User: ${userId}`;

      // Reference to user's reports
      const userReportsRef = ref(db, `blogs/reports/${userId}`);
      onValue(userReportsRef, (snapshot) => {
        tableBody.innerHTML = "";
        let reportCount = 0;

        snapshot.forEach((reportSnap) => {
          const reportId = reportSnap.key;
          const r = reportSnap.val();
          reportCount++;

          // Media thumbnails
          let mediaPreview = "";
          if (r.media && Array.isArray(r.media)) {
            mediaPreview = r.media.map(url => {
              if (url.endsWith(".mp4")) {
                return `<video width="120" height="80" controls><source src="${url}" type="video/mp4"></video>`;
              } else {
                return `<img src="${url}" width="100" height="80" style="object-fit:cover; margin-right:5px;">`;
              }
            }).join(" ");
          } else {
            mediaPreview = "No Media";
          }

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${reportId}</td>
            <td>${r.issue || "No issue"}</td>
            <td>${r.officerAssigned || "Not Assigned"}</td>
            <td>${r.status || "Submitted"}</td>
            <td>${r.location || "N/A"}</td>
            <td>${r.date || "N/A"}</td>
            <td>${mediaPreview}</td>
          `;
          tableBody.appendChild(tr);
        });

        usernameEl.textContent += ` - Total Reports: ${reportCount}`;
      });
    }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
    body { background: #f4f6f8; padding: 20px; }
    h2 { margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    table thead { background: #1976d2; color: #fff; }
    table th, table td { padding: 12px; text-align: left; vertical-align: top; }
    table tbody tr:nth-child(even) { background: #f9f9f9; }
    img, video { border-radius: 5px; margin-right: 5px; }
  </style>
</head>
<body>
  <h2 id="username">User Reports</h2>
  <table>
    <thead>
      <tr>
        <th>Report ID</th>
        <th>Issue</th>
        <th>Officer Assigned</th>
        <th>Status</th>
        <th>Location</th>
        <th>Date</th>
        <th>Media</th>
      </tr>
    </thead>
    <tbody id="user-reports-table"></tbody>
  </table>
</body>
</html>
