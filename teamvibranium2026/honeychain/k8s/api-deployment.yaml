apiVersion: v1
kind: ConfigMap
metadata:
  name: api-env
data:
  PORT: "4000"
  DATABASE_URL: "postgres://honey:chain2026@postgres:5432/honeychain"
  AI_SERVICE_URL: "http://ai:8001"
  CHAIN_RPC_URL: "https://rpc-amoy.polygon.technology"
  FIREBASE_DATABASE_URL: "https://sih2026-b9ef7-default-rtdb.firebaseio.com"
  FIREBASE_PROJECT_ID: "sih2026-b9ef7"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
type: Opaque
stringData:
  JWT_SECRET: "chain2026-kvic-jwt"
  CHAIN_CONTRACT_ADDRESS: ""
  FIREBASE_SERVICE_ACCOUNT: ""
  FIREBASE_API_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: honeychain
    tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: honeychain
      tier: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: honeychain
        tier: api
    spec:
      containers:
        - name: api
          image: honeychain/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: api-env
            - secretRef:
                name: api-secrets
          env:
            - name: PORT
              value: "4000"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: honeychain
    tier: api
spec:
  selector:
    app: honeychain
    tier: api
  ports:
    - port: 4000
      targetPort: 4000
      name: http
  type: ClusterIP
