apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: honeychain
  labels:
    app: honeychain
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: honeychain.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 4000
          - path: /ai
            pathType: Prefix
            backend:
              service:
                name: ai
                port:
                  number: 8001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 4000
