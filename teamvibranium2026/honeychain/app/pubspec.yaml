name: honeychain_app
description: HoneyChain - offline-first harvest logging for beekeepers (SIH 2026).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  sqflite: ^2.3.3
  path: ^1.9.0
  geolocator: ^12.0.0
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  webview_flutter: ^4.8.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/species/
    - assets/flora/
