<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Civic Issue Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    // Firebase config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "blogapp-bd46d.firebaseapp.com",
      databaseURL: "https://blogapp-bd46d-default-rtdb.firebaseio.com/",
      projectId: "blogapp-bd46d",
      storageBucket: "blogapp-bd46d.appspot.com",
      messagingSenderId: "SENDER_ID",
      appId: "APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // DOM Elements
    const tableBody = document.getElementById("complaints-table");
    const totalEl = document.getElementById("total-issues");
    const pendingEl = document.getElementById("pending-issues");
    const resolvedEl = document.getElementById("resolved-issues");
    const progressEl = document.getElementById("progress-issues");

    const officerNames = ["Officer A", "Officer B", "Officer C", "Officer D", "Officer E", "Officer F", "Officer G", "Officer H", "Officer I", "Officer J"];

    // Fetch all users first
    const usersRef = ref(db, "blogs/reports");
    onValue(usersRef, (usersSnapshot) => {
      tableBody.innerHTML = "";
      let total = 0, pending = 0, resolved = 0, progress = 0;

      usersSnapshot.forEach((userSnap) => {
        const userId = userSnap.key;
        const reports = userSnap.val();

        // Iterate through each report for this user
        for (const reportId in reports) {
          const r = reports[reportId];
          total++;
          if (r.status === "Pending") pending++;
          else if (r.status === "Resolved") resolved++;
          else if (r.status === "In Progress") progress++;

          // Media thumbnails
          let mediaPreview = "No Media";
          if (r.media && Array.isArray(r.media) && r.media.length > 0) {
            mediaPreview = r.media.map(url => {
              if (url.endsWith(".mp4")) {
                return `<video width="120" height="80" controls><source src="${url}" type="video/mp4"></video>`;
              } else {
                return `<img src="${url}" width="100" height="80" style="object-fit:cover; margin-right:5px;">`;
              }
            }).join(" ");
          }

          // Officer dropdown
          const officerOptions = officerNames.map(name => {
            const selected = r.officerAssigned === name ? "selected" : "";
            return `<option value="${name}" ${selected}>${name}</option>`;
          }).join("");

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${reportId}</td>
            <td>${r.issue}</td>
            <td>
              <select>
                ${officerOptions}
              </select>
            </td>
            <td>${r.status}</td>
            <td>${r.location}</td>
            <td>${r.date}</td>
            <td>${mediaPreview}</td>
            <td><a href="report.html?userId=${userId}" target="_blank">View</a></td>
            <td><!-- Action dropdown placeholder --></td>
          `;
          tableBody.appendChild(tr);
        }
      });

      // Update header cards
      totalEl.textContent = total;
      pendingEl.textContent = pending;
      resolvedEl.textContent = resolved;
      progressEl.textContent = progress;

      // Chart update
      updateChart(pending, resolved, progress);
    });

    let chart;
    function updateChart(p, r, g) {
      const ctx = document.getElementById('issuesChart').getContext('2d');
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: ['Pending', 'Resolved', 'In Progress'],
          datasets: [{ data: [p, r, g], backgroundColor: ['#FF8042', '#00C49F', '#0088FE'] }]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
      });
    }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
    body { display: flex; background-color: #f4f6f8; }
    .sidebar { width: 220px; background: #1976d2; color: #fff; height: 100vh; padding: 20px; position: fixed; }
    .sidebar h2 { margin-bottom: 20px; font-size: 20px; }
    .sidebar ul { list-style: none; }
    .sidebar ul li { margin: 15px 0; cursor: pointer; }
    .sidebar ul li:hover { text-decoration: underline; }
    .main { margin-left: 240px; padding: 20px; width: 100%; }
    .topbar { background: #1976d2; color: #fff; padding: 15px; border-radius: 8px; font-size: 20px; font-weight: bold; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 20px 0; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1); text-align: center; }
    .card h3 { font-size: 18px; margin-bottom: 10px; }
    .card p { font-size: 24px; font-weight: bold; color: #1976d2; }
    table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 20px; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1); }
    table thead { background: #1976d2; color: #fff; }
    table th, table td { padding: 12px; text-align: left; vertical-align: top; }
    table tbody tr:nth-child(even) { background: #f9f9f9; }
    img, video { border-radius: 5px; margin-right: 5px; }
    select { padding: 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>INNOINDIA</h2>
    <ul>
      <li>Dashboard</li>
      <li>Complaints</li>
      <li>Analytics</li>
      <li>Settings</li>
      <li>History</li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="topbar">Civic Issue Dashboard</div>

    <!-- Dashboard Cards -->
    <div class="cards">
      <div class="card"><h3>Total Issues</h3><p id="total-issues">0</p></div>
      <div class="card"><h3>Pending</h3><p id="pending-issues">0</p></div>
      <div class="card"><h3>Resolved</h3><p id="resolved-issues">0</p></div>
      <div class="card"><h3>In Progress</h3><p id="progress-issues">0</p></div>
    </div>

    <!-- Complaints Table -->
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Issue</th>
          <th>Officer Assigned</th>
          <th>Status</th>
          <th>Location</th>
          <th>Date</th>
          <th>Media</th>
          <th>View</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="complaints-table"></tbody>
    </table>

    <!-- Chart -->
    <div class="chart-container">
      <canvas id="issuesChart"></canvas>
    </div>
  </div>
</body>
</html>
